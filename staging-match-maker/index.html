<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/staging-match-maker/">
<title>Match Maker · Bish's RV</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Answer a few questions and see the campers on Bish's RV lots that fit how you camp.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Wayfinder v2.1 · discovery-question UI matched to Figma
   "MVP - BISHS OS DESIGNS" › Customer Questionnaire · design-extract (node 199-2 family)
   Tokens: Figma variable defs on node 199-2, reconciled with colors_and_type.css
   (deltas are listed in wayfinder-v2-figma-match-notes.md)
   Rev 18 (2026-11-05): Summary → Loading → Matches in the Comparison Desk v4 (Nexus) design
   ============================================================ */
:root{
  --background:#F7F6F1;        /* figma --background  = --surface-light-page */
  --card:#FFFFFF;              /* figma --card        = --surface-light-card */
  --border:#E3E2DE;            /* figma --border      (delta vs --border-light) */
  --border-input:#767676;      /* figma checkbox/radio edge (delta vs --border-input-light #949494) */
  --foreground:#0A0A09;        /* figma --foreground  = --text-light-primary */
  --text-strong:#3D3D38;       /* = --text-light-secondary */
  --muted:#6B6B63;             /* figma --muted-foreground = --text-light-tertiary */
  --header-meta:#A2A59C;       /* = --text-muted (figma used #7A7D76; WCAG rule says never) */
  --cream:#E7DDB4;             /* = --brand-cream, text only */
  --surface-page:#020000;      /* figma --surface-page = --brand-black */
  --accent-gold:#8B752E; --accent-gold-hi:#B89E4A; --gold-text:#5E4F1F; --text-on-gold:#020000;
  --sel-tile:rgba(184,158,74,.16);  /* choice tile selected fill  (gold-hi 16%) */
  --sel-row:rgba(139,117,46,.12);   /* option row selected fill   (gold 12%) */
  --track:rgba(139,117,46,.20);     /* progress track             (primary 20%) */
  --ring:rgba(184,158,74,.50);
  --radius-md:6px; --radius-lg:8px; --radius-card:12px;   /* figma 6 / 8 / 12 (delta vs 8 / 12 / 16) */
  --font-display:'Bebas Neue','Barlow Condensed',Impact,sans-serif;
  --font-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Source Sans 3',system-ui,sans-serif;
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-card:0 4px 3px rgba(0,0,0,.06),0 10px 7.5px rgba(0,0,0,.06);
  --ease:cubic-bezier(.2,0,0,1); --dur:150ms;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,output{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}

/* ---- header (Figma Header/customer) ---- */
.header{background:var(--surface-page);color:#fff;position:sticky;top:0;z-index:10}
.header .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:16px;line-height:24px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.brand .b{width:28px;height:28px;border-radius:4px;background:var(--accent-gold-hi);color:var(--text-on-gold);display:grid;place-items:center;font-size:14px;line-height:20px}
.meta{font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--header-meta);text-align:right;display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:flex-end}
.meta .units b{font-weight:600;color:var(--cream)}
@media(max-width:640px){.meta .split{display:none}}   /* mobile header keeps one line: count + step */

/* ---- page + card (Figma Stack · max-w 672 · card-pad 32) ---- */
.page{padding:16px;display:flex;justify-content:center;align-items:center;min-height:calc(100dvh - 52px);container-type:inline-size;container-name:page}   /* Figma Row: items-center justify-center min-h-844 */
.card{width:100%;max-width:672px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px;container-type:inline-size;container-name:card}
@container page (min-width:600px){.page{padding:24px}.card{padding:32px}}
@media(min-width:641px){.header .hrow{padding:12px 24px}}
.screen{display:none}.screen.active{display:block}
.form{display:flex;flex-direction:column;gap:24px}
.fieldset{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-direction:column;gap:4px}
.step-label{font-family:var(--font-ui);font-weight:700;font-size:11px;line-height:16.5px;letter-spacing:.55px;text-transform:uppercase;color:var(--gold-text)}
.title{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:32px;letter-spacing:.75px;text-transform:uppercase;color:var(--foreground);overflow-wrap:anywhere}
@container page (min-width:600px){.title{font-size:30px;line-height:36px}}
.title .hint{font-family:var(--font-ui);font-weight:400;font-size:14px;line-height:20px;letter-spacing:0;color:var(--muted);white-space:nowrap}
.sub{margin:0;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.group-label,.field-label{font-family:var(--font-ui);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.group-label.dark{color:var(--foreground);font-size:11px;letter-spacing:.55px;line-height:16.5px}
.group-label.gold{color:var(--gold-text);font-size:11px;letter-spacing:.55px;line-height:16.5px}
.label-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fieldset>.group-label+.rows{margin-top:-8px}
.note{font-size:13px;line-height:18px;color:var(--muted);margin:0}
.note b{color:var(--text-strong);font-weight:600}

/* ---- progress (Figma Progress + dots + RV marker) ---- */
.progress{position:relative;height:28px;margin:8px 0}
.progress .track{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);border-radius:9999px;background:var(--track);overflow:hidden}
.progress .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-gold-hi);border-radius:9999px;transition:width var(--dur) var(--ease)}
.progress .dots{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;height:10px}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--card);border:1px solid var(--border);padding:0}
.dot.done{background:var(--accent-gold-hi);border-color:var(--accent-gold-hi)}
.dot.current{opacity:0}
.dot::before{content:"";position:absolute;inset:-17px}   /* 44×44 hit area on a 10px dot */
.dot:disabled{cursor:default}
.marker{position:absolute;top:0;height:28px;width:65px;padding:4px 6px;border-radius:9999px;background:var(--background);box-shadow:0 1px 1px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;transition:left var(--dur) var(--ease)}
.marker img{width:53px;height:20px;object-fit:contain;display:block}

/* ---- choice tiles (Figma Choice Tile · layout=image) ---- */
.tiles{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container card (min-width:440px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container card (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:88px;padding:8px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius-lg);text-align:center;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.tile .art{height:64px;width:100%;display:flex;align-items:center;justify-content:center}
.tile .art img{max-width:100%;max-height:60px;object-fit:contain;display:block}
.tiles.two .tile .art{height:96px}.tiles.two .tile .art img{max-height:90px}
.tile .label{font-family:var(--font-ui);font-weight:700;font-size:11px;line-height:16.5px;letter-spacing:.275px;text-transform:uppercase;color:var(--foreground)}
.tile .live{font-family:var(--font-ui);font-weight:400;font-size:11px;line-height:14px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.tile:hover{border-color:var(--accent-gold-hi)}
.tile[aria-pressed=true]{border-color:var(--accent-gold-hi);background:var(--sel-tile)}
.tile:disabled{opacity:.5;cursor:not-allowed}

/* ---- photo tiles (Figma Choice Tile frame + the hi-fi configurator's room photography: 1.34:1 cover, 2-up mobile / 3-up desktop, gold check) ---- */
.ptiles{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container card (min-width:560px){.ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ptile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius-lg);text-align:center;cursor:pointer;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.ptile .photo{display:block;width:100%;aspect-ratio:1.34/1;overflow:hidden;border-radius:4px;background:#EFEDE4}
.ptile .photo img{width:100%;height:100%;object-fit:cover;display:block}
.ptile .photo img.ph,.ptile .photo img.fit{object-fit:contain}   /* diagrams (sidewall cut-aways) are shown whole, never cropped */
.ptile .label{font-family:var(--font-ui);font-weight:700;font-size:11px;line-height:16.5px;letter-spacing:.275px;text-transform:uppercase;color:var(--foreground);padding-top:4px}
.ptile .live{font-family:var(--font-ui);font-weight:400;font-size:11px;line-height:14px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.ptile .tg-item{margin-top:4px}
.ptile .check{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent-gold-hi);color:var(--text-on-gold);display:none;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ptile:hover{border-color:var(--accent-gold-hi)}
.ptile[aria-pressed=true]{border-color:var(--accent-gold-hi);background:var(--sel-tile)}
.ptile[aria-pressed=true] .check{display:grid}
.ptile:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}

/* ---- option rows (Figma Option Row · checkbox | radio) ---- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:48px;padding:8px 12px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;font-family:var(--font-ui);font-weight:500;font-size:14px;line-height:20px;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.row:hover{border-color:var(--accent-gold-hi)}
.row.on{border-color:var(--accent-gold);background:var(--sel-row)}
.row input{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;flex:none;border:1px solid var(--border-input);background:var(--card);border-radius:2px;display:grid;place-items:center;cursor:pointer}
.row input[type=radio]{border-radius:50%}
.row input:checked{border-color:var(--accent-gold)}
.row input[type=radio]:checked::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-gold)}
.row input[type=checkbox]:checked{background:var(--accent-gold)}
.row input[type=checkbox]:checked::before{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.row .text{flex:1 1 140px;min-width:0}
.row .live{font-family:var(--font-ui);font-weight:400;font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-left:auto}
.row .tg-item{margin-left:4px}

/* ---- fields (Figma Input size=touch 44 · Popover Trigger · unit suffix) ---- */
.fields{display:grid;gap:16px;grid-template-columns:1fr}
@container card (min-width:560px){.fields.cols2{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.input-row{display:flex;align-items:center;gap:8px}
.input,.select{height:44px;width:100%;max-width:220px;padding:0 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);font-family:var(--font-body);font-size:16px}
.input.wide,.select{max-width:none}
.input::placeholder{color:var(--muted)}
.select{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%230A0A09' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m7 15 5 5 5-5'/><path d='m7 9 5-5 5 5'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
.suffix{font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.valuebox{display:flex;flex-direction:column;gap:2px}
.value-label{font-family:var(--font-ui);font-weight:700;font-size:11px;line-height:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.value{font-family:var(--font-ui);font-weight:700;font-size:20px;line-height:24px;color:var(--accent-gold)}
.value.big{font-family:var(--font-display);font-weight:400;font-size:36px;line-height:40px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;display:block}
.range::-webkit-slider-runnable-track{height:6px;border-radius:9999px;background:linear-gradient(90deg,var(--accent-gold-hi) var(--p,0%),var(--track) var(--p,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--accent-gold-hi);box-shadow:var(--shadow-xs)}
.range::-moz-range-track{height:6px;border-radius:9999px;background:var(--track)}
.range::-moz-range-progress{height:6px;border-radius:9999px;background:var(--accent-gold-hi)}
.range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--accent-gold-hi)}
.range-ends{display:flex;justify-content:space-between;font-family:var(--font-ui);font-size:11px;line-height:14px;color:var(--muted)}
.results.locked{filter:blur(6px);opacity:.45;pointer-events:none;user-select:none;max-height:720px;overflow:hidden;mask-image:linear-gradient(#000 60%,transparent)}
.lead{background:var(--card);border:2px solid var(--accent-gold-hi);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-md,0 8px 24px rgba(0,0,0,.08))}
.lead-head{display:flex;flex-direction:column;gap:6px} .lead-form{display:flex;flex-direction:column;gap:12px} .lead-form .input.wide{max-width:none} .lead-btn{align-self:flex-start;min-width:200px} .lead-err{color:#B42318} .lead-fine{font-size:12px}
@container card (min-width:560px){.lead-form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px} .lead-form .lead-err,.lead-form .lead-btn,.lead-form .lead-fine{grid-column:1/-1}}
/* Rev 13: finance block gating, thumb-following value, pulsing untouched thumbs */
.tg-lg .tg-item{font-size:16px;line-height:22px;padding:11px 18px;min-height:48px} .fit3 .tg-lg .tg-item{padding:8px 12px;font-size:15px}
.group-label.lg{font-size:14px;line-height:20px;letter-spacing:.5px;text-transform:none;color:var(--foreground)}
.finance-rest{display:flex;flex-direction:column;gap:16px;transition:opacity var(--dur) var(--ease)} .finance-rest.dim{opacity:.3;pointer-events:none}
.range-wrap{position:relative;padding-top:44px} .range-val{position:absolute;top:0;left:clamp(64px,calc(10px + (100% - 20px) * var(--pf,0)),calc(100% - 64px));transform:translateX(-50%);white-space:nowrap;pointer-events:none}
@keyframes thumbPulse{0%{box-shadow:0 0 0 0 rgba(176,138,37,.55)}70%{box-shadow:0 0 0 12px rgba(176,138,37,0)}100%{box-shadow:0 0 0 0 rgba(176,138,37,0)}}
.range-box{position:relative;display:block} .range-box .pulse{position:absolute;top:22px;left:calc(10px + (100% - 20px) * var(--pf,0));width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--accent-gold-hi);pointer-events:none;animation:ringPulse 1.5s ease-out infinite}
@keyframes ringPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.range-box .pulse{animation:none;transform:scale(1.6);opacity:.5}}
.live-count{display:block;font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:2px 0 4px}
.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:0;background:none;border:0;font-family:var(--font-body);font-size:14px;color:var(--accent-gold);text-decoration:underline;cursor:pointer} .linkbtn:hover{color:var(--accent-gold-hi)}

/* ---- toggle group (Figma Toggle-Group-Item/outline) ---- */
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg-item{min-height:44px;padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);font-family:var(--font-ui);font-weight:500;font-size:14px;line-height:20px;color:var(--foreground);transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.tg-item:hover{border-color:var(--accent-gold-hi)}
.tg-item[aria-pressed=true]{border-color:var(--accent-gold-hi);box-shadow:0 0 0 1px var(--accent-gold-hi);background:var(--sel-tile);font-weight:600}

/* ---- stepper (Figma Step 6 · Button/outline/icon 44 + Text/0) ---- */
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
/* Rev 8: the three steppers sit side by side at every width and never reflow when the child cards appear below them */
.steppers{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px 12px} .steppers .stepper-row{flex-direction:column;align-items:flex-start;gap:4px}
.reserved{visibility:hidden;pointer-events:none} .reserved .tile{min-height:104px}
.stepper-row .lbl{font-family:var(--font-ui);font-weight:500;font-size:14px;line-height:20px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;background:var(--background);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);display:grid;place-items:center;padding:0}
.stepper button:hover{border-color:var(--accent-gold-hi)}
.stepper button:disabled{opacity:.5;cursor:not-allowed}
.stepper output{min-width:48px;min-height:44px;padding:0 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);display:grid;place-items:center;font-family:var(--font-display);font-size:20px;line-height:28px}

/* ---- step footer (Figma Step Footer · outline/touch + gold/lg-touch) ---- */
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--border);padding-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;white-space:nowrap;padding:0 16px;border-radius:var(--radius-md);font-family:var(--font-ui);font-weight:700;font-size:14px;line-height:20px;letter-spacing:.35px;text-transform:uppercase;border:1px solid var(--border);background:var(--card);color:var(--foreground);transition:border-color var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.btn:hover{border-color:var(--accent-gold-hi)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{padding:0 24px;border-color:transparent;background:linear-gradient(180deg,var(--accent-gold-hi),var(--accent-gold));color:var(--text-on-gold)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.gold:disabled{opacity:.4;filter:none}
@container page (max-width:599.9px){.footer{position:sticky;bottom:0;z-index:2;background:var(--card);margin:0 -20px -20px;padding:16px 20px 16px}}

/* ---- fit-to-viewport (Zach, 2026-10-28: every option on screen at all times, no scrolling; only Matches scrolls) ----
   body.fit pins header + card to the viewport; the question body (.qbody) gets the remaining height. After each render
   fitScreen() measures overflow and applies cumulative density levels fit1 → fit2 → fit3, then a last-resort zoom. */
html,body{height:100%}
body.fit{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.fit .header{flex:none}
body.fit .page{flex:1;min-height:0;overflow:hidden;align-items:center}
body.fit .card{max-height:100%;display:flex;flex-direction:column;overflow:hidden}
body.fit .screen.active{display:flex;flex-direction:column;flex:1;min-height:0}
body.fit .form{flex:1;min-height:0}
body.fit .fieldset{flex:1;min-height:0}
body.fit .qbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
@container page (max-width:599.9px){body.fit .footer{position:static;margin:0;padding:16px 0 0}}
/* fit1 · tighten */

/* ---------- build the engine session from the state (the same fields questionnaire.js writes) ---------- */
function buildSession(){
  const s = E.newSession(snap);
  s.gates.classes = classesNow();
  // budget
  if (S.budget==='cash' && Number(S.maxSpend)>0){ const r=E.cashCeiling(Number(S.maxSpend)); if(r.valid){ s.gates.priceMax=r.ceiling; s.budget.priceCeiling=r.ceiling; s.budget.mode='cash'; } }
  if (S.budget==='finance' && S.tier && Number(S.payment)>0){ const tax = S.store && snap.lookups.rooftops[S.store] ? snap.lookups.rooftops[S.store].salesTaxRate : null; const r=E.solveFinanceCeiling(Object.assign({monthlyPayment:Number(S.payment),downPayment:Number(S.down)||0,creditTier:S.tier}, tax!=null?{taxRate:tax}:{})); s.budget.mode='finance'; s.budget.solved=r; if(r.valid){ s.gates.priceMax=r.ceiling; s.budget.priceCeiling=r.ceiling; } }
  // tow
  if (S.path==='TOW' && S.tow==='yes' && Number(S.towRating)>0){ s.tow={applies:true,rating:Number(S.towRating),mode:S.towMode}; s.gates.gvwrMax=Math.round(S.towMode==='raw'?Number(S.towRating):Number(S.towRating)*0.9); }
  // sleepers
  s.sleepers={adults:S.adults,children:S.children}; const total=S.adults+S.children; if(total>0) s.gates.sleepsMin=total;
  if (S.children>0) s.lifestylePaths.push('family'); else if (S.adults<=2) s.lifestylePaths.push('couple');
  const pushOpt=(o,qid)=>{ if(!o) return; if(o.kind==='gate') applyPatch(s,o.patch); else if(o.kind==='rank'){ s.prefs.push({key:qid+':'+o.id,source:qid,concept:o.concept,label:o.title,ids:o.ids,strength:o.strength}); if(o.avoid) s.avoids.push({key:qid+':'+o.id+':avoid',source:qid,concept:o.avoid.concept,label:'Avoid Murphy bed',ids:o.avoid.ids,strength:o.avoid.strength}); } else if(o.kind==='avoid') s.avoids.push({key:qid+':'+o.id,source:qid,concept:o.concept,label:o.title,ids:o.ids,strength:o.strength}); else if(o.kind==='sidewall') s.sidewallPref=o.sidewall; if(o.priority) (Array.isArray(o.priority)?o.priority:[o.priority]).forEach(p=>s.numericPriorities[p]=true); };
  const childOpts = S.path==='MOTOR' ? [O.loft,O.convert] : [O.bunksMust,O.bunksPref,O.flex];
  if (S.children>0) pushOpt(childOpts.find(o=>o.id===S.childSetup),'sleep');
  pushOpt([O.pmMust,O.pmPref,O.openSpace,O.anyBed].find(o=>o.id===S.bedroom),'bedroom');
  if (S.lengthMode==='hard' && lengthCap()!=null) s.gates.lengthMaxFt=lengthCap(); if (S.lengthMode==='soft') s.numericPriorities.compact=true;
  for (const key of ['bath','inside','outside']){ const opts=multiOptsAll(key); S[key].forEach(id=>{ const o=opts.find(x=>x.id===id); if(!o) return; if(S[key+'Must'].has(id)&&o.must) applyPatch(s,o.must); else pushOpt(o,key); if(o.concept==='office') s.lifestylePaths.push('extended'); }); }
  pushOpt([O.space,O.balanced,O.simple].find(o=>o.id===S.size),'size');
  if (S.build && S.build!=='either'){ if(S.buildMust) s.gates.sidewall=S.build==='laminate'?'LAMINATE':'STT'; else pushOpt(O[S.build],'build'); }
  return s;
}
function applyPatch(s,patch){ Object.keys(patch).forEach(k=>{ if(k==='requiredChars') patch[k].forEach(id=>{ if(!s.gates.requiredChars.includes(id)) s.gates.requiredChars.push(id); }); else if(k==='requiredAnyOf') s.gates.requiredAnyOf.push(...patch[k]); else s.gates[k]=patch[k]; }); }
// garage length is a gate in the live build but not in this engine version: applied as a pre-filter on the unit list
function unitsNow(){ let list=UNITS; if(S.loc) list=list.filter(u=>u.location===S.loc); const ft=Number(S.garageFt); if(TOY.includes(S.type)&&ft>0) list=list.filter(u=>u.garageLength==null||u.garageLength>=ft*12); return list; }
let session, cand, pool;
function recompute(){ session=buildSession(); cand=E.candidates(unitsNow(),session.gates); pool=cand.verified.concat(cand.probable); lengthBase=null; }
/* Rev 11: live count while the length slider moves — same gates as now, minus the length cap, re-cut at the slider's foot value */
let lengthBase=null;
function lengthCountText(ft){ if(!lengthBase){ const g=Object.assign({},session.gates,{lengthMaxFt:null}); const c=E.candidates(unitsNow(),g); lengthBase=c.verified.concat(c.probable); } ft=Number(ft); const cap=ft>=41?Infinity:ft*12; let fit=0,unk=0; lengthBase.forEach(u=>{ if(u.lengthIn==null) unk++; else if(u.lengthIn<=cap) fit++; }); return `${n(fit+unk)} campers fit at this length${unk?` · ${n(unk)} don’t list a length`:''}`; }
const share = ids => pool.length ? E.previewBoost(pool,ids)/pool.length : 0;
const splits = o => { if(!o.ids) return true; const sh=share(o.ids); return sh>=0.05 && sh<=0.95; }; // the doc's coverage band
function liveText(o){
  if(o.kind==='gate'){ const c=E.previewGate(unitsNow(),session.gates,o.patch).counts; return [`${n(c.total)} campers fit${c.probable?` · ${n(c.probable)} need a check`:''}`,'gate']; }
  if(o.kind==='rank'){ return [`${n(pool.length)} ${pool.length===1?'camper fits':'campers fit'} · ${n(E.previewBoost(pool,o.ids))} rank higher`,'rank']; }
  if(o.kind==='avoid'){ return [`${n(E.previewBoost(pool,o.ids))} have this · shown lower`,'avoid']; }
  if(o.kind==='sidewall'){ const k=o.sidewall==='laminate'?'LAMINATE':'STT'; return [`${n(pool.filter(u=>u.sidewallConstruction===k).length)} built this way`,'rank']; }
  if(o.kind==='prio'){ return ['sorts by size and weight','rank']; }
  if(o.kind==='info'){ return ['','open']; }
  return [`keeps all ${n(pool.length)}`,'open'];
}

function itile(o,on,onclick){ return `<button type="button" class="tile ico" aria-pressed="${on}" onclick="${onclick}"><span class="icon"><img alt="" width="36" height="36" src="${o.icon||TILE_ICON[o.id]||o.img}"></span><span class="label">${esc(o.title)}</span></button>`; }
function tile(o,on,onclick){ const [lt,lk]=liveText(o); return `<button type="button" class="tile" aria-pressed="${on}" onclick="${onclick}"><span class="art"><img alt="" src="${o.img}"></span><span class="label">${esc(o.title)}</span><span class="live ${lk}">${lt}</span></button>`; }
function ptile(o,on,onclick,extraHtml){ const [lt,lk]=liveText(o); return `<div class="ptile" role="button" tabindex="0" aria-pressed="${on}" onclick="${onclick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"><span class="check">${ICON.check}</span><span class="photo"><img alt="" class="${hasPhoto(o)?'':'ph'}${o.fit==='contain'?' fit':''}" src="${o.img}"></span><span class="label">${esc(o.title)}</span><span class="live ${lk}">${lt}</span>${extraHtml||''}</div>`; }
function rowItem(o,on,type,name,onchange,extraHtml){ const [lt,lk]=liveText(o); return `<label class="row ${on?'on':''}"><input type="${type}" name="${name}" ${on?'checked':''} onchange="${onchange}"><span class="text">${esc(o.title)}</span><span class="live ${lk}">${lt}</span>${extraHtml||''}</label>`; }
function rowsSingle(opts,key,name){ return `<div class="rows">${opts.map(o=>rowItem(o,S[key]===o.id,'radio',name||('q-'+key),`S['${key}']='${o.id}';refresh()`)).join('')}</div>`; }
function checkRow(label,checked,onchange){ return `<label class="row ${checked?'on':''}"><input type="checkbox" ${checked?'checked':''} onchange="${onchange}"><span class="text">${label}</span></label>`; }
function storeSelect(){ return `<select class="select" aria-label="Closest Bish's store" onchange="S.store=this.value;refresh()"><option value="">Not sure yet · 6% tax estimate</option>${Object.values(snap.lookups.rooftops||{}).filter(r=>r.storeName&&!['CRD','MSV','LIN'].includes(r.location)).sort((a,b)=>a.storeName.localeCompare(b.storeName)).map(r=>`<option value="${r.location}" ${S.store===r.location?'selected':''}>${esc(r.storeName)}</option>`).join('')}</select>`; }

/* progress: one dot per visible step, gold fill to the current step, RV marker riding the track (Figma Progress + Row of dots + img/travel_trailer) */
function progress(vis,pos){ const total=vis.length; const frac=total>1?(pos-1)/(total-1):0; const art=S.path==='MOTOR'?FIG.A:FIG.TT;
  return `<div class="progress" role="group" aria-label="Step ${pos} of ${total}"><div class="track"><div class="fill" style="width:${(frac*100).toFixed(2)}%"></div></div><div class="dots">${vis.map((v,i)=>`<button type="button" class="dot ${i+1<pos?'done':''} ${i+1===pos?'current':''}" ${i+1<pos?'':'disabled'} aria-label="Step ${i+1}: ${esc(txt(v.nav))}" title="${esc(txt(v.nav))}" onclick="EDIT_RETURN=null;go(${screens.indexOf(v)})"></button>`).join('')}</div><div class="marker" style="left:calc((100% - 65px) * ${frac.toFixed(4)})"><img alt="" src="${art}"></div></div>`; }
function footer(idx,s,vis){ const first=idx===0; const ret=EDIT_RETURN&&!s.scroll&&!s.results; /* Rev 18: Summary is the last step before Matches; an Edit from Summary / Matches returns there */
  return `<div class="footer"><button type="button" class="btn" onclick="go(${idx-1})" ${first?'disabled':''}>${first?'Back':'Previous'}</button>${tradeBtn()}<button type="button" class="btn gold" onclick="${ret?'goReturn()':`go(${idx+1})`}" ${s.ok&&!s.ok()?'disabled':''}>${ret?(EDIT_RETURN==='results'?'Back to matches':'Back to summary'):'Next'}</button></div>`; }

function findUnits(q){ q=(q||'').trim().toLowerCase(); if(q.length<2) return []; const toks=q.split(/\s+/).filter(Boolean);
  const hits=UNITS.filter(u=>{ const sn=String(u.stocknumber).toLowerCase(); if(sn.startsWith(q)) return true; const hay=`${u.year} ${u.manufacturer} ${u.make} ${u.model} ${sn}`.toLowerCase(); return toks.every(t=>hay.includes(t)); });
  hits.sort((a,b)=>(a.isLStock-b.isLStock)||(b.year-a.year)||String(a.manufacturer).localeCompare(String(b.manufacturer)));
  return groupDupes(hits.map(u=>({unit:u}))).slice(0,6); }

/* Pre-fill the questionnaire so this unit scores as high as the ranking system allows:
   every hard gate is set to a value the unit passes (and skipped where the unit has no data, so it stays "confirmed"
   rather than "needs a check"), and every ranking preference the unit actually has is selected. The tow rating is
   left open — a weight limit belongs to the shopper's vehicle, not to the unit. */
function applyTarget(u){ const has=ids=>ids.some(id=>(u.characteristicTypeIds||[]).includes(id)); const cls=u.class;
  S.path=E.MOTORHOME_CLASSES.includes(cls)?'MOTOR':'TOW'; if(S.path==='MOTOR'){ S.motor=cls; S.type=null; } else { S.type=cls; S.motor=null; }
  if(u.price>0){ S.budget='cash'; S.maxSpend=String(Math.ceil(u.price*1.15/500)*500); } else { S.budget='cash'; S.maxSpend=''; }
  S.tow=S.path==='TOW'?'no':null;
  if(u.sleeps!=null&&u.sleeps>=2){ S.adults=2; S.children=0; } else { S.adults=0; S.children=0; } S.childSetup=null;
  S.bedroom = has([I.PRIVATE_MASTER]) ? 'prefer' : ((S.path!=='MOTOR'&&has([I.MURPHY,I.REAR_LIVING,I.FRONT_LIVING])) ? 'space' : 'open');
  S.lengthMode='none'; S.lengthFt=''; S.garageFt=TOY.includes(cls)?'any':'';
  for(const key of ['bath','inside','outside']){ S[key].clear(); S[key+'Must'].clear(); multiOptsAll(key).forEach(o=>{ if(o.kind==='avoid'){ if(!has(o.ids)) S[key].add(o.id); } else if(o.ids&&has(o.ids)) S[key].add(o.id); }); }
  S.size = (u.slides!=null&&u.slides>=2&&has(E.SLIDE_IDS)) ? 'space' : (u.slides===0 ? 'simple' : 'balanced');
  S.build = u.sidewallConstruction==='LAMINATE' ? 'laminate' : (u.sidewallConstruction==='STT' ? 'value' : 'either'); S.buildMust=false; }
/* duplicates = same year / manufacturer / make / model; the highest-ranked member represents the group unless the shopper picks another from the dropdown */
function groupDupes(list){ const map=new Map(); list.forEach(x=>{ const k=unitKey(x.unit); if(!map.has(k)) map.set(k,{key:k,rep:x,members:[]}); map.get(k).members.push(x); });
  return [...map.values()].map(g=>{ const pick=S.dupPick[g.key]; const m=pick?g.members.find(x=>String(x.unit.stocknumber)===String(pick)):null; if(m) g.rep=m; return g; }); }
function unitDistance(a,b){ const jac=(x,y)=>{ const A=new Set(x||[]),B=new Set(y||[]); if(!A.size&&!B.size) return 1; let i=0; A.forEach(v=>{ if(B.has(v)) i++; }); return i/(A.size+B.size-i); };
  const num=(x,y,scale)=> (x==null||y==null)?0.5:Math.min(2,Math.abs(x-y)/scale);
  return (a.class!==b.class?3:0) + num(a.lengthIn,b.lengthIn,120) + num(a.slides,b.slides,1) + num(a.sleeps,b.sleeps,2) + ((a.sidewallConstruction||'')!==(b.sidewallConstruction||'')?1:0) + 2*(1-jac(a.characteristicTypeIds,b.characteristicTypeIds)) + num(a.price,b.price,20000); }
function nextClosest(groups, target){ const cands=groups.filter(g=>!target||unitKey(g.rep.unit)!==unitKey(target)); const K=cands.slice(0,15); const out=[];
  if(!cands.length) return out; const p1=cands[0]; out.push({label:'Closest match', g:p1});
  if(target){ let best=null,bd=-1; K.forEach(g=>{ if(g===p1) return; const d=unitDistance(g.rep.unit,target); if(d>bd){ bd=d; best=g; } }); if(best) out.push({label:'Closest match · biggest difference', g:best}); }
  else if(K[1]) out.push({label:'Runner-up', g:K[1]});
  let cheap=null; K.forEach(g=>{ if(out.some(o=>o.g===g)) return; const pr=g.rep.unit.price; if(pr>0&&(!cheap||pr<cheap.rep.unit.price)) cheap=g; }); if(cheap) out.push({label:'Closest match · lowest price', g:cheap});
  return out; }
